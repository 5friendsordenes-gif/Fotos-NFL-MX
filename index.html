<script>
        const SUPABASE_URL = "https://sirzpsrublygrfzupzoi.supabase.co";
        const SUPABASE_KEY = "sb_publishable_YTlcXsZo-lnjWw5E0axQGg_Y092_nGx";
        const BUCKET_NAME = "fotos-nfl";
        const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        /* ==============================================================
           1. MARCADOR EN VIVO AUTOMÁTICO (SIN CACHÉ)
        ============================================================== */
        async function fetchLiveScore() {
            const statusText = document.getElementById('gc-status-text');
            const liveDot = document.getElementById('live-dot');
            const clockEl = document.getElementById('game-clock');

            if (statusText) statusText.textContent = "Actualizando marcador...";

            try {
                // El parámetro ?t= evita que el celular cargue datos viejos en caché
                const url = `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?t=${Date.now()}`;
                const res = await fetch(url, { cache: "no-store" });
                const data = await res.json();
                const events = data.events || [];

                // Buscar específicamente Vikings (MIN) vs 49ers (SF)
                let game = events.find(ev => {
                    const text = ((ev.name || "") + " " + (ev.shortName || "")).toUpperCase();
                    const abbrs = ev.competitions?.[0]?.competitors?.map(c => c.team?.abbreviation?.toUpperCase()) || [];
                    return (abbrs.includes('MIN') && abbrs.includes('SF')) ||
                           (text.includes('VIKINGS') && text.includes('49ERS'));
                });

                if (!game) {
                    if (statusText) statusText.textContent = "No se encontró MIN vs SF en la jornada activa";
                    return;
                }

                const comp = game.competitions[0];
                const min = comp.competitors.find(c => c.team?.abbreviation === 'MIN') || comp.competitors[1];
                const sf = comp.competitors.find(c => c.team?.abbreviation === 'SF') || comp.competitors[0];
                const state = comp.status?.type?.state; // 'pre', 'in', 'post'
                const detail = comp.status?.type?.shortDetail || comp.status?.type?.description || 'En curso';

                if (liveDot) liveDot.classList.toggle('active', state === 'in');
                if (statusText) {
                    statusText.textContent = state === 'in'
                        ? "En Vivo · Estadísticas Oficiales"
                        : (state === 'post' ? "Marcador Final · NFL México" : "Previo del Partido · NFL México");
                }
                if (clockEl) clockEl.textContent = detail;

                // Compatible con ambas versiones de tu HTML (min-score/sf-score o away-score/home-score)
                const minScoreEl = document.getElementById('min-score') || document.getElementById('away-score');
                const sfScoreEl = document.getElementById('sf-score') || document.getElementById('home-score');
                if (minScoreEl) minScoreEl.textContent = min.score ?? '0';
                if (sfScoreEl) sfScoreEl.textContent = sf.score ?? '0';

                // Cuartos (Q1 - Q4)
                const getQ = (t, idx) => t.linescores?.[idx]?.value ?? '-';
                const qBody = document.getElementById('quarters-body');
                if (qBody) {
                    qBody.innerHTML = `
                        <tr>
                            <td>${min.team?.abbreviation || 'MIN'}</td>
                            <td>${getQ(min, 0)}</td><td>${getQ(min, 1)}</td><td>${getQ(min, 2)}</td><td>${getQ(min, 3)}</td>
                            <td>${min.score ?? '0'}</td>
                        </tr>
                        <tr>
                            <td>${sf.team?.abbreviation || 'SF'}</td>
                            <td>${getQ(sf, 0)}</td><td>${getQ(sf, 1)}</td><td>${getQ(sf, 2)}</td><td>${getQ(sf, 3)}</td>
                            <td>${sf.score ?? '0'}</td>
                        </tr>
                    `;
                }

                // Estadísticas / Líderes
                const leadersGrid = document.getElementById('leaders-grid');
                if (leadersGrid) {
                    const catNames = {
                        passingYards: 'Líder en Pase',
                        rushingYards: 'Líder en Carrera',
                        receivingYards: 'Líder en Recepción'
                    };
                    const leaders = comp.leaders || [];
                    leadersGrid.innerHTML = '';
                    leaders.slice(0, 3).forEach(cat => {
                        const top = cat.leaders?.[0];
                        if (!top) return;
                        leadersGrid.innerHTML += `
                            <div class="leader-card">
                                <span class="leader-cat">${catNames[cat.name] || cat.displayName}</span>
                                <span class="leader-name">${top.athlete?.shortName || 'Jugador'}</span>
                                <span class="leader-stat">${top.displayValue || ''}</span>
                            </div>
                        `;
                    });
                }
            } catch (err) {
                if (statusText) statusText.textContent = "Error de conexión · Toca Actualizar";
            }
        }

        // Conectar botón de actualizar (funciona con ambos botones)
        const refreshBtn = document.getElementById('gc-refresh') || document.getElementById('rt-badge');
        if (refreshBtn) {
            refreshBtn.style.cursor = 'pointer';
            refreshBtn.addEventListener('click', fetchLiveScore);
        }

        fetchLiveScore();
        setInterval(fetchLiveScore, 30000); // Se actualiza solo cada 30 segundos

        /* ==============================================================
           2. GALERÍA Y SUBIDA DE FOTOS (SUPABASE)
        ============================================================== */
        const galleryEl = document.getElementById('gallery');
        const photoCountEl = document.getElementById('photo-count');
        let photosList = [];
        let currentIndex = 0;

        async function loadGallery() {
            if (!sb || !galleryEl) return;
            const { data, error } = await sb.storage.from(BUCKET_NAME).list('', {
                limit: 200,
                sortBy: { column: 'created_at', order: 'desc' }
            });
            if (error) return;

            const validFiles = (data || []).filter(f => f.name && !f.name.startsWith('.'));
            photosList = validFiles.map(file => {
                const { data: urlData } = sb.storage.from(BUCKET_NAME).getPublicUrl(file.name);
                return { name: file.name, url: urlData.publicUrl };
            });

            if (photoCountEl) photoCountEl.textContent = photosList.length;
            if (photosList.length === 0) {
                galleryEl.innerHTML = `<div class="empty-state"><h3>Aún no hay fotografías</h3><p>Sé el primero en subir un recuerdo tocando "Subir Fotos".</p></div>`;
                return;
            }

            galleryEl.innerHTML = '';
            photosList.forEach((photo, idx) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `<img src="${photo.url}" alt="Foto NFL México 2026" loading="lazy">`;
                card.addEventListener('click', () => openLightbox(idx));
                galleryEl.appendChild(card);
            });
        }

        const uploadModal = document.getElementById('upload-modal');
        const fileInput = document.getElementById('file-input');
        const filePreviewText = document.getElementById('file-preview-text');
        const uploadStatus = document.getElementById('upload-status');
        const confirmUploadBtn = document.getElementById('confirm-upload-btn');

        document.getElementById('open-upload-btn')?.addEventListener('click', () => {
            uploadStatus.textContent = '';
            fileInput.value = '';
            filePreviewText.textContent = '📁 Toca aquí para elegir tus fotos';
            uploadModal.classList.add('open');
        });
        document.getElementById('close-upload-btn')?.addEventListener('click', () => uploadModal.classList.remove('open'));
        fileInput?.addEventListener('change', () => {
            const count = fileInput.files.length;
            filePreviewText.textContent = count > 0 ? `✓ ${count} foto(s) seleccionada(s)` : '📁 Toca aquí para elegir tus fotos';
        });

        confirmUploadBtn?.addEventListener('click', async () => {
            const files = fileInput.files;
            if (!files.length) { uploadStatus.textContent = 'Selecciona al menos una foto.'; return; }
            confirmUploadBtn.disabled = true;
            confirmUploadBtn.textContent = 'Subiendo...';
            let uploaded = 0;
            for (const file of files) {
                uploadStatus.textContent = `Subiendo ${uploaded + 1} de ${files.length}...`;
                const ext = file.name.split('.').pop() || 'jpg';
                const fileName = `nfl-${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
                const { error } = await sb.storage.from(BUCKET_NAME).upload(fileName, file, { cacheControl: '3600', upsert: false });
                if (!error) uploaded++;
            }
            confirmUploadBtn.disabled = false;
            confirmUploadBtn.textContent = 'Subir ahora';
            if (uploaded > 0) {
                uploadStatus.textContent = `✓ ¡${uploaded} foto(s) agregada(s)!`;
                await loadGallery();
                setTimeout(() => uploadModal.classList.remove('open'), 900);
            } else {
                uploadStatus.textContent = 'No se pudo subir. Revisa las políticas del bucket.';
            }
        });

        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lb-img');
        const lbDownload = document.getElementById('lb-download');
        const lbShare = document.getElementById('lb-share');

        function openLightbox(idx) {
            currentIndex = idx;
            lbImg.src = photosList[currentIndex].url;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }

        document.getElementById('lb-close')?.addEventListener('click', closeLightbox);
        lightbox?.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.getElementById('lb-prev')?.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + photosList.length) % photosList.length;
            lbImg.src = photosList[currentIndex].url;
        });
        document.getElementById('lb-next')?.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % photosList.length;
            lbImg.src = photosList[currentIndex].url;
        });

        lbDownload?.addEventListener('click', async () => {
            const photo = photosList[currentIndex];
            lbDownload.textContent = 'Descargando...';
            try {
                const res = await fetch(photo.url);
                const blob = await res.blob();
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `BancoBASE-NFL-${currentIndex + 1}.jpg`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(blobUrl);
            } catch { window.open(photo.url, '_blank'); }
            lbDownload.textContent = '⬇ Descargar Foto';
        });

        lbShare?.addEventListener('click', async () => {
            if (navigator.share) {
                try { await navigator.share({ title: 'Banco BASE · Vikings vs 49ers México 2026', url: window.location.href }); } catch {}
            } else {
                navigator.clipboard.writeText(window.location.href);
                lbShare.textContent = '✓ Link copiado';
                setTimeout(() => { lbShare.textContent = '↗ Compartir'; }, 2000);
            }
        });

        loadGallery();
    </script>
